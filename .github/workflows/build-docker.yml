name: Build and push base images

on:
  workflow_call:
    inputs:
      push_images:
        description: "Whether built images should be pushed to the registry"
        required: true
        type: boolean
      build_hopper:
        description: "Also build the opt-in FlashAttention 3 images for Hopper GPUs"
        required: false
        default: false
        type: boolean

jobs:
  build-nvidia-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-cache-py312-torch2141
          - nvidia-cache-py313-torch2141
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7.5.0
        with:
          push: ${{ inputs.push_images }}
          pull: true
          targets: ${{ matrix.target }}

  build-core-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - cpu-core-py312-torch2141
          - cpu-core-py313-torch2141
          - amd-core-py312-torch2141
          - amd-core-py313-torch2141
          - nvidia-core-py312-torch2141
          - nvidia-core-py313-torch2141
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7.5.0
        with:
          push: ${{ inputs.push_images }}
          pull: true
          targets: ${{ matrix.target }}

  build-nvidia-extensions:
    needs: [build-nvidia-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-sageattention-py312-torch2141
          - nvidia-sageattention-py313-torch2141
          - nvidia-xformers-py312-torch2141
          - nvidia-xformers-py313-torch2141
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7.5.0
        with:
          push: ${{ inputs.push_images }}
          pull: true
          targets: ${{ matrix.target }}

  build-amd-full:
    needs: [build-core-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - amd-full-py312-torch2141
          - amd-full-py313-torch2141
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7.5.0
        with:
          push: ${{ inputs.push_images }}
          pull: true
          targets: ${{ matrix.target }}

  build-nvidia-full:
    needs: [build-nvidia-cache, build-core-images, build-nvidia-extensions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-full-py312-torch2141
          - nvidia-full-py313-torch2141
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7.5.0
        with:
          push: ${{ inputs.push_images }}
          pull: true
          targets: ${{ matrix.target }}

  build-nvidia-hopper:
    if: ${{ inputs.build_hopper }}
    needs: [build-nvidia-full]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-hopper-py312-torch2141
          - nvidia-hopper-py313-torch2141
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7.5.0
        with:
          push: ${{ inputs.push_images }}
          pull: true
          targets: ${{ matrix.target }}
