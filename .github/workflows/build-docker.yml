name: Build and push base images

on:
  workflow_call:
    inputs:
      push_images:
        description: "Whether built images should be pushed to the registry"
        required: true
        type: boolean

jobs:
  build-nvidia-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-cache-py312
          - nvidia-cache-py313
    steps:
      - uses: actions/checkout@v5
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v6
        with:
          push: ${{ inputs.push_images }}
          targets: ${{ matrix.target }}

  build-core-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - cpu-core-py312
          - cpu-core-py313
          - amd-core-py312
          - amd-core-py313
          - nvidia-core-py312
          - nvidia-core-py313
    steps:
      - uses: actions/checkout@v5
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v6
        with:
          push: ${{ inputs.push_images }}
          targets: ${{ matrix.target }}

  build-nvidia-extensions:
    needs: [build-nvidia-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-sageattention-py312
          - nvidia-sageattention-py313
          - nvidia-nunchaku-py312
          - nvidia-nunchaku-py313
          - nvidia-xformers-py312
          - nvidia-xformers-py313
          - nvidia-flashattention-py312
          - nvidia-flashattention-py313
    steps:
      - uses: actions/checkout@v5
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v6
        with:
          push: ${{ inputs.push_images }}
          targets: ${{ matrix.target }}

  build-nvidia-full:
    needs: [build-nvidia-cache, build-core-images, build-nvidia-extensions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - nvidia-full-py312
          - nvidia-full-py313
    steps:
      - uses: actions/checkout@v5
      - name: Pre-create BuildKit volume on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ci
      - name: Log in to registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v6
        with:
          push: ${{ inputs.push_images }}
          targets: ${{ matrix.target }}
