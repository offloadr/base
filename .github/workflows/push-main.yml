name: Build base images on pushes to main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_hopper:
        description: "Also publish the opt-in FlashAttention 3 images for Hopper GPUs"
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build-docker.yml
    with:
      push_images: true
      build_hopper: ${{ inputs.build_hopper || false }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
